modules:
  macro:
    - key: hmg-adapter-test
      title: HMG Adapter Test
      description: postMessage 기반 REST Adapter 패턴 검증용 테스트 매크로
      resource: main
      resolver:
        function: resolver

  function:
    - key: resolver
      handler: resolvers/index.handler

resources:
  - key: main
    path: static/main/build

permissions:
  scopes:
    # 이 테스트 앱이 Adapter로 중계할 API들에 필요한 scope.
    # (실제 운영 페이지에 맞춰 필요한 것만 남기고 줄이면 됩니다)
    - read:page:confluence
    - write:page:confluence
    - read:content:confluence
    - write:content.property:confluence
    - read:confluence-user
    - read:confluence-content.all
    - storage:app
  content:
    scripts:
      - unsafe-inline
      - unsafe-eval
    styles:
      - unsafe-inline

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/5c67e7d8-10a6-4ffe-9ccf-3c1717073da1
